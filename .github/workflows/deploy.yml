name: Deploy CMS

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./test/... -v -count=1


  deploy-backend:
    name: Deploy backend
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check backend changes
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qv '^app/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy backend
        if: steps.changes.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            cd /home/serv-admin/Documents/projects/cms-web

            git pull --ff-only origin main

            go build -o cms-web.new .
            mv cms-web.new cms-web

            sudo systemctl restart cms
            sudo systemctl is-active --quiet cms

            echo "Backend deployed successfully."


  deploy-frontend:
    name: Deploy frontend
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check frontend changes
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^app/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy frontend
        if: steps.changes.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            cd /home/serv-admin/Documents/projects/cms-web

            git pull --ff-only origin main

            cd app

            npm ci
            npm run build

            sudo rm -rf /var/www/cms/*
            sudo cp -a dist/. /var/www/cms/

            sudo nginx -t
            sudo systemctl reload nginx

            echo "Frontend deployed successfully."
            